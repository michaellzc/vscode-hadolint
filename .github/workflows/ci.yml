name: ci

on:
  push:
    branches:
      - "master"
  pull_request: {}

env:
  HADOLINT_VERSION: "2.14.0"
  NODE_VERSION: "24"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install
      - run: npx biome check
      - run: npm run test:unit

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/cache@v4
        name: .vscode-test cache
        with:
          path: .vscode-test
          key: ${{ runner.os }}-vscode-test
          restore-keys: |
            ${{ runner.os }}-vscode-test

      - run: npm install

      # hadolint ships no darwin-arm64 build, so use Homebrew on macOS and the
      # published binary on Linux.
      - run: brew install hadolint
        if: runner.os == 'macOS'
      - run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          curl -L -o "$GITHUB_WORKSPACE/bin/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v$HADOLINT_VERSION/hadolint-Linux-x86_64"
          chmod +x "$GITHUB_WORKSPACE/bin/hadolint"
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
        if: runner.os == 'Linux'

      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os == 'macOS'
